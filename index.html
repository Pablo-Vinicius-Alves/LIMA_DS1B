<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Loja Illury - Poções de Cura">
    <link rel="stylesheet" href="./style/style.css">
    <title>Loja Illury</title>
</head>

<body>
    <header>
        <div class="bordainterna">
            <div class="cabecalho">
                <h1>Lojinha do Illury</h1>
            </div>
        </div>
    </header>

    <main>
        <div class="principal">
            <article class="artCenter">
                <h2>Poções de Cura</h2>
            </article>

            <div class="distribuida">
                <article class="artImage">
                    <img src="style/imagens/pocao.jpg" alt="Poção de Cura pequena">
                    <p class="nomeProduto">Poção de Cura</p>
                    <p class="preco">R$ 15,00</p>
                     <button class="botaoLuizao"> Comprar</button>
                </article>
                <article class="artImage">
                    <img src="style/imagens/pocao.jpg" alt="Poção de Cura média">
                    <p class="nomeProduto">Poção de Cura</p>
                    <p class="preco">R$ 25,00</p>
                     <button class="botaoLuizao"> Comprar</button>
                </article>
                <article class="artImage">
                    <img src="style/imagens/pocao.jpg" alt="Poção de Cura grande">
                    <p class="nomeProduto">Poção de Cura</p>
                    <p class="preco">R$ 40,00</p>
                     <button class="botaoLuizao"> Comprar</button>
                </article>
                <article class="artImage">
                    <img src="style/imagens/pocao.jpg" alt="Poção de Cura extra grande">
                    <p class="nomeProduto">Poção de Cura</p>
                    <p class="preco">R$ 60,00</p>
                     <button class="botaoLuizao"> Comprar</button>
                </article>
                <article class="artImage">
                    <img src="style/imagens/pocao.jpg" alt="Poção de Cura suprema">
                    <p class="nomeProduto">Poção de Cura</p>
                    <p class="preco">R$ 80,00</p>
                     <button class="botaoLuizao"> Comprar</button>
                </article>
                <article class="artImage">
                    <img src="style/imagens/pocao.jpg" alt="Poção de Cura mágica">
                    <p class="nomeProduto">Poção de Cura</p>
                    <p class="preco">R$ 100,00</p>
                     <button class="botaoLuizao"> Comprar</button>
                </article>
                <article class="artImage">
                    <img src="style/imagens/pocao.jpg" alt="Poção de Cura lendária">
                    <p class="nomeProduto">Poção de Cura</p>
                    <p class="preco">R$ 150,00</p>
                     <button class="botaoLuizao"> Comprar</button>
                </article>
                <article class="artImage">
                    <img src="style/imagens/pocao.jpg" alt="Poção de Cura épica">
                    <p class="nomeProduto">Poção de Cura</p>
                    <p class="preco">R$ 200,00</p>
                     <button class="botaoLuizao"> Comprar</button>
                </article>
            </div>
        </div>
    </main>

    <footer>
        <div class="bordafooter">
            <p>Rua Antônio Quitaúna</p>
        </div>
    </footer>
</body>

</html>
